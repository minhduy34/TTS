[project]
name = "ai-service"
version = "0.1.0"
description = "Multi-agent student management AI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "faker>=40.38.0",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
